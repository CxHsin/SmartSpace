[package]
name = "smartspace"
version = "0.1.0"
description = "A local-first Windows desktop workspace"
authors = ["CxHsin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smartspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
