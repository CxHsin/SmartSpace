[package]
name = "smartspace"
version = "0.1.0"
description = "A local-first Windows desktop workspace"
authors = ["CxHsin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smartspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

